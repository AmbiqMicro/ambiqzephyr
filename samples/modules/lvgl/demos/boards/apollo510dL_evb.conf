CONFIG_LV_USE_DRAW_AMBIQ=y
CONFIG_LV_USE_AMBIQ_VG=y
CONFIG_LV_DRAW_BUF_ALIGN=8
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=8
# Benchmark uses transformed layers (full W×H×3 RGB888 chunks, e.g. 468×156 ≈ 214 KiB each).
# Simple layers are subdivided via LV_DRAW_LAYER_SIMPLE_BUF_SIZE; transformed layers are not.
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=32768
CONFIG_LV_BIN_DECODER_RAM_LOAD=y
# CONFIG_LV_USE_LOG=y
# CONFIG_LV_LOG_LEVEL_WARN=y
# CONFIG_LV_LOG_LEVEL_INFO=y
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_USE_MEM_MONITOR=y
CONFIG_LV_PERF_MONITOR_ALIGN_BOTTOM_MID=y
CONFIG_LV_MEM_MONITOR_ALIGN_TOP_MID=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_DEF_REFR_PERIOD=16

CONFIG_LV_Z_LARGE_CONST_SECTION=".gfx.assets"
CONFIG_LV_Z_COLOR_24_BGR_TO_RGB=n
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
CONFIG_LV_Z_USE_OSAL=y
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=262144
# Framebuffer / draw buffers: map LVGL heap into MSPI PSRAM (XIP0). Supported on apollo510dL when
# MEMC is enabled; board dts must expose ambiq,psram in chosen, XIP0 MPU in DT, and early PM ref
# (see boards/ambiq/apollo510dL_evb/apollo510dL_evb.dts and board.c).
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="XIP0"
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
# Full-screen display/draw buffers via lv_draw_buf_create() in MSPI PSRAM (XIP0)
CONFIG_LV_Z_DRAW_BUF_ZEPHYR_REGION=y
CONFIG_LV_Z_DRAW_BUF_ZEPHYR_REGION_NAME="XIP0"
CONFIG_LV_Z_DRAW_BUF_HEAP_SIZE=2097152
CONFIG_LV_Z_REFRESH_AREA_WIDTH=468
CONFIG_LV_Z_REFRESH_AREA_HEIGHT=468
#CONFIG_NO_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_CPU_LOAD=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# Dynamic thread support
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

CONFIG_HEAP_MEM_POOL_SIZE=20480
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=4096

CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Nema render heap: NEMA_MEM_POOL_FB (pool 1) + CL — lv_draw_ambiq layer buffers land here.
# With PSRAM placement the board's 236 KiB SRAM_NO_CACHE cap does not apply; benchmark needs
# headroom for multiple ~214 KiB layer buffers on the 468×468 panel.
CONFIG_NEMAGFX_RENDER_HEAP_IN_PSRAM=y
CONFIG_NEMAGFX_HEAP_SIZE_RENDER=2048

# Shell + LOG on same UART: avoid VT100 escapes interleaving with log lines
CONFIG_SHELL_VT100_COMMANDS=n

CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=n

CONFIG_DISPLAY=y
CONFIG_MEMC=y
CONFIG_MEMC_MSPI_APS_Z8=y
CONFIG_MEMC_MSPI_APS25616BA=y
CONFIG_NEMAGFX_HEAP_SIZE_ASSETS=512
