CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_DISPLAY=y
CONFIG_LOG=y

# Keep GPU/DSI/display blocks awake; LVGL demos use the same setting.
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=n

CONFIG_NEMAGFX_HEAP_SIZE_RENDER=1280
CONFIG_NEMAGFX_HEAP_SIZE_ASSETS=256

# Run one benchmark pass and exit (used by Twister).
CONFIG_TEST=y
