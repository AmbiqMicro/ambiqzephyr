CONFIG_I2S=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PINCTRL=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Console stays up for the banner, then the sample suspends uart0.
CONFIG_PM_DEVICE_RUNTIME_DISABLE_CONSOLE=n

# Unused buses/devices are status=disabled in board overlays.
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_WATCHDOG=n
CONFIG_FLASH=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_DISK_ACCESS=n
CONFIG_CRYPTO=n
CONFIG_ENTROPY_GENERATOR=n
