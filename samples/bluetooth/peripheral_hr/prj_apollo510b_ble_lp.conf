CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y

CONFIG_BT_DEVICE_NAME="Zephyr Heartrate Sensor"
CONFIG_BT_DEVICE_APPEARANCE=833

# LP advertising uses 500 ms intervals in main.c when CONFIG_SOC_AMBIQ_APOLLO5X_BLE_LP
# (matches AmbiqSuite fit LP). Preferred connection params reduce connected wakeups.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=400
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=480
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=3200

# EM9305 over SPI (not 510L IPC/RSS). BT_AMBIQ_HCI selects SPI/GPIO when enabled.

# Match AmbiqSuite ble_freertos_fit_lp early SoC init for Apollo510 Blue (EM9305):
# LFRC RTC, XTAL pwdn in deep sleep, ITCM32K/DTCM128K, caches off,
# peripheral gating with IOM6 kept for HCI SPI. See CONFIG_SOC_AMBIQ_APOLLO5X_BLE_LP.
# Note: fit_lp on 510B uses SRAM_NONE (DTCM-only); this Zephyr build retains SSRAM
# for stack/heap headroom — see boards/apollo510b_evb_ble_lp.overlay.
# Enabling this option will further reduce power consumption in sleep modes, but with risk
# of stability. Disable if you experience stability issues.
CONFIG_SOC_AMBIQ_APOLLO5X_BLE_LP=y

# SoC LP init disables I/D cache; keep Kconfig aligned (510L LP uses same pattern).
CONFIG_ICACHE=n
CONFIG_DCACHE=n

CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Keep Ambiq HAL pin/clock hooks; BT stack selects SPI/GPIO for EM9305 HCI.
CONFIG_PINCTRL=y
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_WATCHDOG=n

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# fit_lp enters SLEEP_DEEP from idle; do not block on PM device busy (SPI/GPIO stay ready for EM9305 IRQ).
# CONFIG_PM_NEED_ALL_DEVICES_IDLE is not set

# CPU idle: long timer slips + default policy choose suspend-to-idle / suspend-to-ram from DT.
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_POLICY_DEFAULT=y
