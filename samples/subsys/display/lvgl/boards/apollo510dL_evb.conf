# lvgl_allocate_rendering_buffers() allocates hor_res * ver_res at the pixel
# format the display driver reports, so on the 468x468 ap510_disp panel running
# RGB_888 that is 657072 bytes. LV_Z_VDB_SIZE is not consulted on this path and
# LV_COLOR_DEPTH does not override the driver's format, so neither shrinks it.
#
# The only lever is the size handed to lv_display_create(). Leave the width at
# its default of 0, which takes the panel resolution, and cap the height: that
# is 468x96 on ap510_disp and 280x96 on ap510_jdi_disp, both of which fit in
# SRAM. The demos instead keep the full screen out of a 2 MiB PSRAM heap.
#
# Naming a width here would break ap510_jdi_disp, which is 280 wide and is
# supported on this same board.
#
# This renders a centred band rather than the whole panel. That is enough to
# prove the display, DSI and touch path without PSRAM; it is not a substitute
# for the demos as a graphics test.
CONFIG_LV_Z_REFRESH_AREA_HEIGHT=96
CONFIG_LV_Z_MEM_POOL_SIZE=262144

# The sample enables LV_USE_LOG at warning level. Once the display comes up
# that is quiet, but while it does not, every refresh reports "No draw buffer"
# and every touch reports "Could not put input data into queue", which buries
# the one line that matters. Keep errors, drop the rest.
CONFIG_LV_LOG_LEVEL_ERROR=y
