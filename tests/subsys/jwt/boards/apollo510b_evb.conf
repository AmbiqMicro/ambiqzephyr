# ES256 signing reaches mbedtls_ecdsa_sign()/_verify(), which this routes to
# the CryptoCell-312 PKA.
CONFIG_MBEDTLS_ALT_AMBIQ_CC312_ECDSA=y

# p256-m claims the secp256r1 PSA path ahead of mbed TLS' own ECDSA, which
# would silently bypass the accelerator.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
