# Software baseline for the CC312 benchmark. Only the ECDSA rows can be moved
# to hardware from inside mbed TLS, so leave the ALT off here and enable it in
# a second build to get the hardware comparison.
# CONFIG_MBEDTLS_ALT_AMBIQ_CC312_ECDSA is not set
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
