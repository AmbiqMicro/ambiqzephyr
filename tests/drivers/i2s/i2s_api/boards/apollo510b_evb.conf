# Two-device loopback on the mikroBUS (click) header:
#   I2S0 TX (master)  ->  I2S1 RX (target)
#   SCK  -> RST    (I2S0_CLK_P5    -> I2S1_CLK_P16)
#   MISO -> CS     (I2S0_WS_P7     -> I2S1_WS_P10)
#   MOSI -> AN     (I2S0_SDOUT_P6  -> I2S1_DATA_P17)
CONFIG_I2S_TEST_SEPARATE_DEVICES=y
CONFIG_I2S_TEST_USE_GPIO_LOOPBACK=y
CONFIG_I2S_TEST_USE_I2S_DIR_BOTH=n
CONFIG_I2S_TEST_ALLOWED_DATA_OFFSET=2

# ===========================================================================
# DO NOT REMOVE: the I2S driver log level MUST stay OFF for this test.
#
# This is a test-timing workaround, not a driver bug.
#
# test_i2s_state_running_neg streams with only ONE block of lookahead and,
# between every write, fires four triggers that are invalid on purpose
# (START and PREPARE on a RUNNING TX and RX). The driver rejects each one
# with -EIO and a LOG_ERR, as it should.
#
# The test's prj.conf selects CONFIG_LOG_MODE_MINIMAL, so every LOG_ERR is
# printed synchronously on the 115200 baud console: about 3 ms per line,
# about 12 ms for the four of them. One block here is 32 frames at 8 kHz,
# 4 ms. The TX queue therefore runs dry, the driver correctly reports a TX
# underrun and moves to ERROR, the next tx_block_write() fails, and every
# later test fails in before() because the RX side was left RUNNING.
#
# With the I2S log silenced the triggers still return -EIO (which is what
# the test checks) and the stream keeps up. apollo510_evb.conf carries the
# same setting for the same reason.
# ===========================================================================
CONFIG_I2S_LOG_LEVEL_OFF=y
