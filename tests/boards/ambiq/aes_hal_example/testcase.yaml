tests:
  boards.ambiq.aes_hal_example:
    tags:
      - ambiq
      - crypto
      - aes
    harness: console
    harness_config:
      type: one_line
      regex:
        - "All driver checks passed"
    platform_allow:
      - apollo330mP_evb
      - apollo330mP_evb/apollo330P
      - apollo510_evb
      - apollo510_evb/apollo510
      - apollo510b_evb
      - apollo510b_evb/apollo510b
      - apollo510dL_evb
      - apollo510dL_evb/apollo510L
