 # start of software interrupt number
CONFIG_ISR_OFFSET=92
CONFIG_UART_INTERRUPT_DRIVEN=n

# The radio subsystem exists only on Apollo330P and Apollo510L. board.c
# starts it in board_early_init_hook, and its mailbox IRQ_CONNECTs IRQ 17
# and 18. This test builds with GEN_ISR_TABLES=n, so IRQ_CONNECT installs
# nothing and those slots stay null in the hand-written vector table.
CONFIG_SOC_AMBIQ_RSS_MGR=n
CONFIG_MBOX_AMBIQ=n
